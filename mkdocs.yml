site_name: qbase
site_description: kdb+/q core libraries and framework
repo_url: https://github.com/belowzeroff/qbase
repo_name: belowzeroff/qbase
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Concepts: core-concepts.md
  - Module Guides:
      - log: modules/log.md
      - cargs: modules/cargs.md
      - require: modules/require.md
      - http: modules/http.md
  - API Reference: api-reference.md
