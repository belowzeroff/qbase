name: Docs

# Manual-only for now — run it from the Actions tab when you are ready to publish.
# Add a `release`/`push` trigger here to publish docs automatically.
on:
  workflow_dispatch:

# Build the MkDocs site and deploy it to GitHub Pages.
# 'enablement: true' turns Pages on for the repository on the first run.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
